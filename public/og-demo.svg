<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1113"/>
      <stop offset="100%" stop-color="#14181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#f2f0ea08" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#f2f0ea08" stroke-width="1"/>

  <!-- ECG line decoration -->
  <polyline
    points="60,400 160,400 200,290 240,480 290,200 340,400 520,400 560,340 600,400 640,400"
    fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <!-- Logo mark -->
  <circle cx="136" cy="180" r="40" fill="url(#accent)"/>
  <circle cx="136" cy="180" r="22" fill="#2dd4bf" opacity="0.9"/>

  <!-- Brand name -->
  <text x="196" y="197" font-family="Georgia, serif" font-size="56" font-weight="400" fill="#f2f0ea" letter-spacing="-1.5">Hygia</text>

  <!-- Eyebrow -->
  <text x="136" y="270" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#2dd4bf" letter-spacing="0.14em">DEMO PÚBLICA</text>

  <!-- Big headline -->
  <text x="136" y="332" font-family="Georgia, serif" font-size="52" font-weight="400" fill="#f2f0ea" letter-spacing="-1">Prueba Hygia en</text>
  <text x="136" y="392" font-family="Georgia, serif" font-size="52" font-weight="300" fill="#2dd4bf" font-style="italic" letter-spacing="-1">3 consultas gratis.</text>

  <!-- Subline -->
  <text x="136" y="440" font-family="-apple-system, system-ui, sans-serif" font-size="20" fill="#c6c3ba">Sin registro. Sin tarjeta. Casos clínicos reales.</text>

  <!-- CTA pill -->
  <rect x="136" y="480" width="240" height="52" rx="26" fill="#f2f0ea" stroke="none"/>
  <text x="256" y="513" font-family="-apple-system, system-ui, sans-serif" font-size="17" font-weight="500" fill="#0e1113" text-anchor="middle" letter-spacing="0.02em">Probar la demo →</text>

  <!-- Right side: mockup de un caso clínico -->
  <rect x="760" y="150" width="380" height="330" rx="16" fill="#191d20" stroke="#f2f0ea14" stroke-width="1"/>

  <!-- Header del mockup: Hygia · demo pública -->
  <circle cx="784" cy="184" r="5" fill="#2dd4bf" opacity="0.9"/>
  <text x="800" y="189" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#7f837f" letter-spacing="0.12em">HYGIA · DEMO PÚBLICA</text>

  <!-- Pregunta del usuario (burbuja alineada derecha) -->
  <rect x="820" y="220" width="296" height="72" rx="12" fill="#f2f0ea" stroke="none"/>
  <text x="834" y="248" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#0e1113" font-weight="500">Varón 58a, dolor retroesternal</text>
  <text x="834" y="266" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#0e1113">opresivo, sudoración, T neg en</text>
  <text x="834" y="284" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#0e1113">V4-V6. ¿Diferencial?</text>

  <!-- Respuesta Hygia (burbuja alineada izquierda) -->
  <text x="784" y="326" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#7f837f" letter-spacing="0.06em">HYGIA</text>
  <rect x="784" y="336" width="332" height="120" rx="12" fill="#f2f0ea0d" stroke="#f2f0ea14" stroke-width="1"/>
  <text x="798" y="360" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#c6c3ba" font-weight="600">1. SCA sin elevación del ST</text>
  <text x="798" y="380" font-family="-apple-system, system-ui, sans-serif" font-size="12.5" fill="#c6c3ba">   T negativas V4-V6 → isquemia</text>
  <text x="798" y="400" font-family="-apple-system, system-ui, sans-serif" font-size="12.5" fill="#c6c3ba">   anterolateral. Trop + ECG serial.</text>
  <text x="798" y="424" font-family="-apple-system, system-ui, sans-serif" font-size="12.5" fill="#c6c3ba" font-weight="600">2. Disección aórtica</text>
  <text x="798" y="444" font-family="-apple-system, system-ui, sans-serif" font-size="12.5" fill="#c6c3ba">   Descartar antes de anticoagular.</text>

  <!-- Bottom label -->
  <text x="600" y="590" font-family="-apple-system, system-ui, sans-serif" font-size="15" fill="#7f837f" text-anchor="middle" letter-spacing="0.08em">MEDIQ.APP/DEMO</text>
</svg>
